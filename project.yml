name: NexusMobile
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  NexusMobile:
    type: application
    platform: iOS
    sources:
      - path: NexusMobileApp.swift
      - path: ContentView.swift
      - path: Models.swift
      - path: NexusAPI.swift
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: NEXUS
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        NSCameraUsageDescription: "NEXUS uses the camera for image analysis when you choose it."
        NSMicrophoneUsageDescription: "NEXUS uses the microphone for voice commands when you choose it."
        NSLocalNetworkUsageDescription: "NEXUS connects to your PC, Pi-hole, Jellyfin, and other services on your network."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hirsu.nexusmobile
        SWIFT_VERSION: 5.0
        DEVELOPMENT_TEAM: ""
