name: NexusMobile
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  NexusMobile:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - README.md
          - codemagic.yaml
          - .github
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: NEXUS
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        NSCameraUsageDescription: "NEXUS uses the camera for image analysis when you choose it."
        NSMicrophoneUsageDescription: "NEXUS uses the microphone for voice commands when you choose it."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hrushi.nexusmobile
        SWIFT_VERSION: 5.0
        DEVELOPMENT_TEAM: ""
